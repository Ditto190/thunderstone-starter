name: Label sync
# Creates or updates labels from .github/labels.yml. Never deletes labels (deletion needs DT approval).
on:
  push:
    branches: [main]
    paths: [".github/labels.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: label-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Create or update labels (no deletes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          yq -o=json '.[]' .github/labels.yml | jq -c '.' | while IFS= read -r row; do
            name="$(jq -r '.name' <<<"$row")"
            color="$(jq -r '.color' <<<"$row")"
            desc="$(jq -r '.description // ""' <<<"$row")"
            gh label create "$name" --repo "$GITHUB_REPOSITORY" --color "$color" --description "$desc" --force
          done
