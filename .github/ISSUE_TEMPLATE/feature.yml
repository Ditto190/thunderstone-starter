name: Feature
description: Propose a new capability or an improvement.
title: "feat: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who needs this and why, in 1-3 lines.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Smallest change that solves it. Name the files or scripts you expect to touch.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance checks
      description: Commands that must pass, e.g. `npm test`, a new test file, expected exit codes.
      value: |
        - [ ] `npm test` passes
        - [ ]
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options: [scripts, ci, security, agent, docs, deps, browser]
  - type: checkboxes
    id: agent
    attributes:
      label: Agent handling
      options:
        - label: "auto-fix-ok: an agent may implement this as a draft PR"
        - label: "needs-dt: design decision or paid feature involved"
