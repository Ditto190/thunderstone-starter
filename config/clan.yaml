# Generated by node scripts/clan.mjs sync. Edit scripts/clan-contract.mjs.
schema_version: 2
clan: thunderstone
starter_authority: google_drive
active_code_authority: github_after_promotion
default_executor: cursor_cli
recursive_agent_execution: false
startup:
  bootstrap: sh scripts/bootstrap.sh
  login: bash scripts/resume.sh
  session_resume: bash scripts/resume.sh
  desktop: xfce_existing
  terminal: bash
  session_manager: tmux
  require_systemd: false
automation:
  paid_tasks_on_login: false
  checkpoint_commits: opt_in
  remote_push: explicit_approval
  drive_export: curated_additive_only
roles:
  - id: chief-of-chiefs
    title: Chief of Chiefs
    duty: routes tasks
    runnable: false
    perplexity: []
  - id: thunder-terminal
    title: Thunder-Terminal
    duty: owns the VM
    runnable: false
    perplexity: []
  - id: keeper-of-stone-tablets
    title: Keeper of Stone Tablets
    duty: keeps briefs and handoffs
    runnable: false
    perplexity: []
  - id: cursor-hammer
    title: Cursor-Hammer
    duty: implements
    runnable: true
    perplexity: [perplexity_search]
  - id: watcher-of-broken-things
    title: Watcher of Broken Things
    duty: verifies
    runnable: true
    perplexity: [perplexity_search]
  - id: chief-investigator
    title: Chief Investigator
    duty: investigates with deep research
    runnable: true
    perplexity: [perplexity_search, perplexity_research]
connectors:
  perplexity:
    url: https://api.perplexity.ai/mcp
    server: perplexity
    token_env: PERPLEXITY_API_KEY
env:
  - CURSOR_API_KEY
  - RCLONE_CONFIG
  - DRIVE_EXPORT_ROOT
  - ALLOW_LOCAL_COMMITS
  - CLAN_NAME
  - GDRIVE_REMOTE
  - TZ
  - PERPLEXITY_API_KEY
  - PERPLEXITY_BASE_URL
  - PERPLEXITY_LOG
labels:
  - ci
  - docs
  - security
  - deps
  - agent
  - scripts
  - browser
  - breaking
  - skip-review
  - WIP
  - incident
  - regression
  - p0
