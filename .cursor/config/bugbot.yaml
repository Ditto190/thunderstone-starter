# Cursor Bugbot (paid, usage-based). Read from the PR base branch (main).
# Policy: CodeRabbit does the automatic review; Bugbot is a manual second opinion
# (comment "bugbot run" on a PR). If Bugbot is enabled on this repo, set it to
# "Run only when mentioned" in the Cursor dashboard as well.
version: 1

triggers:
  drafts: false
  frequency: oncePerPr

review:
  effort: default
  incremental: true

prSummary:
  mode: disabled

autofix:
  mode: disabled
